<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation system</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="body-form">
        <h1>DEVICE RESERVATION</h1>
        <div class="div-form">
            <form class="form" id="loginForm">
                <div class="title">Sign In,<br><span>to continue</span></div>
                <p id="responseMessage"></p>
                <input class="input" id="emailLogin" name="emailLogin" placeholder="Email" type="email">
                <input class="input" id="passwordLogin" name="passwordLogin" placeholder="Password" type="password">
                <button class="button-confirm" id="SignInBtn">
                    <a>Sign In →</a>
                </button>
                <p>You don't have an account?</p>
                <button class="button-confirm" id="indexRegister">
                    <a>Register →</a>
                </button>
            </form>
        </div>
    </div>


    <script src="../js/login.js"></script>
</body>

</html>
