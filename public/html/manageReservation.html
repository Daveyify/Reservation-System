<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation system</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="body-form">
        <h1>DEVICE RESERVATION</h1>

        <button class="button-profile">
            <a href="reservation.html">My profile</a>
        </button>

        <form id="userReservationForm">
            <label>User ID:</label>
            <input type="number" id="userIdInput" required>
            <button type="submit">Load Reservations</button>
        </form>

        <br>

        <h3>Reservations:</h3>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Begin Date</th>
                    <th>End Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="reservationsTable"></tbody>
        </table>

        <p id="msg"></p>

    </div>
</body>

</html>
