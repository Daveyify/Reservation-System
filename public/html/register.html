<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation system</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="body-form">
        <h1>DEVICE RESERVATION</h1>
        <div class="div-form">
            <form class="form">
                <div class="title">Sign Up,<br><span>create your account.</span></div>
                <p id="responseMessage"></p>    
                <input class="input" id="idRegister" name="idRegister" placeholder="Id" type="number">
                <input class="input" id="emailRegister" name="emailRegister" placeholder="Email" type="email">
                <input class="input" id="passwordRegister" name="passwordRegister" placeholder="Password" type="password">
                <input class="input" id="nameRegister" name="nameRegister" placeholder="Name" type="text">
                <input class="input" id="lastNameRegister" name="lastNameRegister" placeholder="Last Name" type="text">
                <input class="input" id="phoneRegister" name="phoneRegister" placeholder="Phone" type="text">
                <button class="button-confirm" id="SignUpBtn">
                    <a>Register →</a>
                </button>
            </form>
        </div>
    </div>
    <script src="../js/register.js"></script>
</body>

</html>
