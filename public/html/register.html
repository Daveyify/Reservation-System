<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation system</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>

<body>
    <div class="body-form">
        <h1>DEVICE RESERVATION</h1>
        <div class="div-form">
            <form class="form">
                <div class="title">Sign Up,<br><span>create your account.</span></div>
                <input class="input" name="email" placeholder="Email" type="email">
                <input class="input" name="password" placeholder="Password" type="password">
                <input class="input" name="name" placeholder="Name" type="text">
                <input class="input" name="lastName" placeholder="Last Name" type="text">
                <input class="input" name="phone" placeholder="Phone" type="text">
                <button class="button-confirm">
                    <a href="/html/main.html">Register →</a>
                </button>
            </form>
        </div>
    </div>
